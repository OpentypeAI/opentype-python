[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opentype"
dynamic = ["version"]
description = "Python SDK for the OpenType API: decisions, verdicts and model routing."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenType" }]
keywords = ["opentype", "llm", "decision", "structured-output", "router", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Intended Audience :: Developers",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]

[project.urls]
Homepage = "https://opentype.dev"
Documentation = "https://docs.opentype.dev"
Repository = "https://github.com/OpentypeAI/opentype-python"
Issues = "https://github.com/OpentypeAI/opentype-python/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[tool.hatch.version]
path = "src/opentype/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opentype"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "openapi.json", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["src/opentype/types/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["UP007", "UP045", "UP006", "UP035"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/opentype", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "opentype.types._generated"
disable_error_code = ["misc"]
